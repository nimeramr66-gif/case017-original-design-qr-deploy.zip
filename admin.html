<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم المدير | الظل الأخير</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div id="login" class="loginwrap">
  <form id="loginForm" class="glass login" autocomplete="on">
    <h1>الظل الأخير</h1><small>ADMIN CONTROL PANEL · CASE FILE 017</small>
    <label>البريد<input id="em" type="email" dir="ltr" autocomplete="username" required></label>
    <label>كلمة المرور<input id="pw" type="password" dir="ltr" autocomplete="current-password" required></label>
    <button class="btn gold block" id="loginBtn">دخول آمن</button>
    <button type="button" class="link" id="forgot">نسيت كلمة المرور؟</button>
    <div id="loginMsg" role="alert"></div>
    <a class="link" href="index.html">← العودة إلى الموقع</a>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="ttl"><b>الظل الأخير</b><small>THE LAST SHADOW</small></div>
    <div class="ttl2"><b>لوحة تحكم المدير</b><small>Admin Control Panel</small></div>
    <div class="who"><span class="dot"></span><span id="me">—</span><button class="btn ghost sm" id="logout">خروج</button></div>
    <button class="burger" id="burger" aria-label="القائمة">☰</button>
  </header>
  <div class="shell">
    <aside id="side"><nav id="nav"></nav><div class="ver">Admin Panel v1.0</div></aside>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="glass box"><button class="x" id="mx" aria-label="إغلاق">×</button><div id="mbody"></div></div></div>
<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
