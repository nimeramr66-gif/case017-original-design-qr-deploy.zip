<body>
<div id="login" class="loginwrap">
  <form id="loginForm" class="glass login" autocomplete="on">
    <h1>الظل الأخير</h1><small>ADMIN CONTROL PANEL · CASE FILE 017</small>
    <label>البريد<input id="em" type="email" dir="ltr" autocomplete="username" required></label>
    <label>كلمة المرور<input id="pw" type="password" dir="ltr" autocomplete="current-password" required></label>
    <button class="btn gold block" id="loginBtn">دخول آمن</button>
    <button type="button" class="link" id="forgot">نسيت كلمة المرور؟</button>
    <div id="loginMsg" role="alert"></div>
    <a class="link" href="index.html">← العودة إلى الموقع</a>
  </form>
</div>

<div id="app" class="hidden">
  <div class="shell">
    <aside id="side">
      <div class="logo"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="#c6a15b" stroke-width="2.5"/><path d="M26 66c4-3 10-5 15-6l3-14c2-8 9-13 16-13s14 5 16 13l3 14c5 1 11 3 15 6l-4 5c-9-3-19-4-30-4s-21 1-30 4z" fill="#0b0a0a" stroke="#c6a15b" stroke-width="2"/><path d="M42 72h36c0 14-7 22-18 22s-18-8-18-22z" fill="#0b0a0a" stroke="#c6a15b" stroke-width="1.6"/></svg>
        <b>THE LAST SHADOW</b><small>CASE FILE 017</small></div>
      <nav id="nav"></nav>
      <div class="adm"><div class="crown">♛</div><div><b id="me">—</b><small id="role">—</small></div></div>
      <button class="btn ghost sm block" id="logout">تسجيل الخروج ⇥</button>
    </aside>
    <div class="right">
      <header class="top">
        <button class="burger glassb" id="burger" aria-label="القائمة">☰</button>
        <div class="ttl2"><span class="eyebrow" dir="ltr">INVESTIGATION COMMAND CENTER</span><b dir="ltr">ADMINISTRATOR PANEL</b><small>لوحة تحكم المدير</small></div>
        <div class="quote glass-panel"><q dir="ltr">Control the system… Manage the investigation</q></div>
        <div class="tright"><span class="ib bell" title="التنبيهات">🔔</span><span class="avatar" id="avatar">A</span></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="glass box"><button class="x" id="mx" aria-label="إغلاق">×</button><div id="mbody"></div></div></div>
